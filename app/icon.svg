<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0a111f" />
  <!-- white ball; the white shows through as the swirl/seams -->
  <circle cx="16" cy="16" r="14" fill="#ffffff" />
  <!-- three colour patches between the white swirl -->
  <g>
    <path d="M16 16 C 12 13.5, 12 7.5, 15.5 5.6 C 19 6.6, 19.5 12, 17.8 15 C 17.2 16, 16.6 16.1, 16 16 Z"
      fill="#2ea6ff" transform="rotate(8 16 16)" />
    <path d="M16 16 C 12 13.5, 12 7.5, 15.5 5.6 C 19 6.6, 19.5 12, 17.8 15 C 17.2 16, 16.6 16.1, 16 16 Z"
      fill="#ff7a1a" transform="rotate(128 16 16)" />
    <path d="M16 16 C 12 13.5, 12 7.5, 15.5 5.6 C 19 6.6, 19.5 12, 17.8 15 C 17.2 16, 16.6 16.1, 16 16 Z"
      fill="#7cc4ff" transform="rotate(248 16 16)" />
  </g>
  <!-- white hub at the centre of the swirl -->
  <circle cx="16" cy="16" r="2.6" fill="#ffffff" />
</svg>
